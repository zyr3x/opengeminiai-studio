<script>
    let devopsEventSource = null;
    let currentDevopsScript = null;

    function getDevopsStatus() {
        fetch('/api/devops/status')
            .then(r => r.json())
            .then(data => {
                updateDevopsButtons('bugfix_loop.sh', data['bugfix_loop.sh']?.status === 'running');
                updateDevopsButtons('coverage_loop.sh', data['coverage_loop.sh']?.status === 'running');

                if (data['bugfix_loop.sh']?.status === 'running' && currentDevopsScript !== 'bugfix_loop.sh') {
                    attachDevopsStream('bugfix_loop.sh');
                } else if (data['coverage_loop.sh']?.status === 'running' && currentDevopsScript !== 'coverage_loop.sh') {
                    attachDevopsStream('coverage_loop.sh');
                }
            });
    }

    function updateDevopsButtons(scriptName, isRunning) {
        const baseId = scriptName === 'bugfix_loop.sh' ? 'bugfix' : 'coverage';
        const startBtn = document.getElementById(`btn-start-${baseId}`);
        const stopBtn = document.getElementById(`btn-stop-${baseId}`);

        if (startBtn) startBtn.disabled = isRunning;
        if (stopBtn) stopBtn.disabled = !isRunning;

        if (isRunning) {
            if (startBtn) startBtn.classList.replace('btn-outline-success', 'btn-success');
        } else {
            if (startBtn) startBtn.classList.replace('btn-success', 'btn-outline-success');
        }
    }

    function startDevopsScript(scriptName) {
        if (devopsEventSource) {
            devopsEventSource.close();
            devopsEventSource = null;
        }

        fetch('/api/devops/start', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ script_name: scriptName })
        })
            .then(r => r.json())
            .then(data => {
                if (data.error) {
                    alert("Error: " + data.error);
                    return;
                }
                const term = document.getElementById('devops-terminal');
                if (term) term.innerHTML = `<span class="text-success">&gt; Executing ${scriptName}...</span>\n`;

                const activeLabel = document.getElementById('devops-active-script');
                if (activeLabel) {
                    activeLabel.textContent = scriptName;
                    activeLabel.classList.replace('bg-secondary', 'bg-success');
                }

                updateDevopsButtons(scriptName, true);
                attachDevopsStream(scriptName);
            });
    }

    function stopDevopsScript(scriptName) {
        fetch('/api/devops/stop', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ script_name: scriptName })
        })
            .then(r => r.json())
            .then(data => {
                if (data.error) alert("Error: " + data.error);
                updateDevopsButtons(scriptName, false);
                if (devopsEventSource) {
                    devopsEventSource.close();
                    devopsEventSource = null;
                }
                const activeLabel = document.getElementById('devops-active-script');
                if (activeLabel) {
                    activeLabel.textContent = 'Idle';
                    activeLabel.classList.replace('bg-success', 'bg-secondary');
                }

                const term = document.getElementById('devops-terminal');
                if (term) {
                    term.innerHTML += `<span class="text-danger">&gt; Process forcefully terminated.</span>\n`;
                    term.scrollTop = term.scrollHeight;
                }
            });
    }

    function attachDevopsStream(scriptName) {
        currentDevopsScript = scriptName;
        const term = document.getElementById('devops-terminal');
        devopsEventSource = new EventSource(`/api/devops/stream?script_name=${scriptName}`);

        devopsEventSource.onmessage = function (e) {
            const data = JSON.parse(e.data);
            if (data.log && term) {
                term.appendChild(document.createTextNode(data.log));
                term.scrollTop = term.scrollHeight;
            }
        };

        devopsEventSource.addEventListener('end', function (e) {
            const data = JSON.parse(e.data);
            if (term) {
                term.innerHTML += `\n<span class="text-warning">&gt; Process finished with exit code ${data.exit_code}</span>\n`;
                term.scrollTop = term.scrollHeight;
            }
            devopsEventSource.close();
            devopsEventSource = null;
            currentDevopsScript = null;
            updateDevopsButtons(scriptName, false);

            const activeLabel = document.getElementById('devops-active-script');
            if (activeLabel) {
                activeLabel.textContent = 'Idle';
                let bgClass = data.exit_code === 0 ? 'bg-success' : 'bg-danger';
                activeLabel.classList.remove('bg-success', 'bg-secondary');
                activeLabel.classList.add(bgClass);
                setTimeout(() => {
                    activeLabel.classList.remove(bgClass);
                    activeLabel.classList.add('bg-secondary');
                }, 3000);
            }
        });

        devopsEventSource.onerror = function () {
            devopsEventSource.close();
        };
    }

    document.addEventListener('DOMContentLoaded', () => {
        getDevopsStatus();
        setInterval(getDevopsStatus, 5000);
    });
</script>
