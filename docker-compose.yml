version: '3.8'

services:
  gemini-proxy:
    build: .
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    env_file:
      - .env
    environment:
      # Configure Git to skip strict host checking (avoids interactive prompts inside container)
      - GIT_SSH_COMMAND=ssh -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
    restart: unless-stopped
    # Map host.docker.internal to the host gateway to access local ports
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${PROJECTS_PATH}:${PROJECTS_PATH}
      - ./:/app/
      - ${DOCKER_SOCK_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      # Mount SSH key from host to container (read-only)
      - ${SSH_KEY_PATH}:/root/.ssh/id_rsa:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
